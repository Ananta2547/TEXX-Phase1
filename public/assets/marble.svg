<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECE8DB"/><stop offset=".5" stop-color="#DBD5C4"/><stop offset="1" stop-color="#C6BFAC"/>
    </linearGradient>
    <filter id="mv1" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.016" numOctaves="5" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.66  0 0 0 0 0.55  0 0 0 0 0.38  0 0 0 -2.4 1.45"/>
    </filter>
    <filter id="mv2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.05" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.40  0 0 0 0 0.38  0 0 0 0 0.32  0 0 0 -3 1.8"/>
    </filter>
    <radialGradient id="ml" cx=".3" cy=".2" r=".95">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/><stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mvig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2016" stop-opacity="0"/><stop offset="1" stop-color="#1E2016" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#mg)"/>
  <rect width="1200" height="800" filter="url(#mv1)" opacity=".5"/>
  <rect width="1200" height="800" filter="url(#mv2)" opacity=".33"/>
  <rect width="1200" height="800" fill="url(#ml)"/>
  <rect width="1200" height="800" fill="url(#mvig)"/>
