    <filter id="chipB"><feTurbulence type="turbulence" baseFrequency="0.11" numOctaves="2" seed="17" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 -6 3.3"/></filter>
    <filter id="chipC"><feTurbulence type="turbulence" baseFrequency="0.14" numOctaves="2" seed="8" result="n"/>
